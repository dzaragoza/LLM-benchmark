repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: python3 -m ty check
        language: system
        pass_filenames: false
        files: \.py$
      - id: pytest
        name: pytest
        entry: python3 -m pytest tests/ -q
        language: system
        pass_filenames: false
        files: \.py$
      - id: md-tables
        name: markdown check (GFM compliance)
        entry: python3 md_check.py
        language: system
        types: [markdown]
