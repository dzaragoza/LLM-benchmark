repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: main
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: python3 -m ty check
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: python3 -m pytest tests/ -q
        language: system
        pass_filenames: false
