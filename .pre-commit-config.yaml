repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format (fix + restage + exit 0; never aborts the commit)
        entry: python3 format_hook.py
        language: system
        types: [python]
      - id: ty
        name: ty (type check)
        entry: python3 ty_check.py
        language: system
        pass_filenames: false
        files: \.py$
      - id: md-tables
        name: markdown check (GFM compliance)
        entry: python3 AI_tools/md_check.py
        language: system
        types: [markdown]
      - id: requirements-check
        name: requirements check (R-xx traceability, protocol v5.0)
        entry: python3 requirements_check.py
        language: system
        pass_filenames: false
        files: ^(md/protocol\.md|tests/.*\.py|requirements_check\.py)$
      - id: testmon
        name: pytest-testmon (affected tests only; full suite on push - R-25)
        entry: python3 testmon_hook.py
        language: system
        pass_filenames: false
        files: \.py$
