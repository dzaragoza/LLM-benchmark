[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["live-corpus.json", "reports", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ty.src]
respect-ignore-files = true

[tool.ty.environment]
extra-paths = ["AI_tools"]

[tool.mutmut]
source_paths = ["AI_tools/code_edit.py", "md_check.py"]
pytest_add_cli_args_test_selection = ["tests/test_code_edit.py", "tests/test_python_syntax_gate.py", "tests/test_replace_verified.py", "tests/test_safe_append_md.py"]

[tool.pytest.ini_options]
markers = ["hypothesis_props: hypothesis property tests - excluded from the commit hook (R-25), run weekly"]
