[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["live-corpus.json", "reports", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ty.src]
respect-ignore-files = true

[tool.ty.environment]
# Third-party imports resolve against the active environment's
# site-packages (the repo venv installs everything in
# requirements.txt: huggingface_hub, pyarrow, transformers, pytest).
extra-paths = []
