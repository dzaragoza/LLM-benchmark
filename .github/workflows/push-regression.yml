name: push regression run

# Addendum 190 (the author's cost ruling): the CI suite is TOO EXPENSIVE to
# run on every push - the checks now fire ONLY on workflow_dispatch (manual)
# and a weekly schedule. Nothing runs on ordinary pushes. The aggregate
# verdict, all gates, and the fixed-tool set are unchanged - they are simply
# on-demand now. Red CI emails stop: no runs unless asked for.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 1" # 03:00 UTC Monday - the weekly full check

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage vulture
      - name: ruff (lint)
        id: ruff
        continue-on-error: true
        run: python3 -m ruff check .
      - name: ruff format (applied in place, never an error)
        run: python3 -m ruff format .
      - name: ty (type check)
        id: ty
        continue-on-error: true
        run: python3 ty_check.py
      - name: markdown check (GFM compliance)
        id: md
        continue-on-error: true
        run: python3 AI_tools/md_check.py
      - name: requirements check (R-xx traceability)
        id: reqs
        continue-on-error: true
        run: python3 requirements_check.py
      - name: pytest (the full suite - deterministic pins + hypothesis properties)
        id: pytest
        continue-on-error: true
        run: python3 -m pytest tests -q
      - name: crosshair (the contract proofs)
        id: crosshair
        continue-on-error: true
        run: crosshair check tests/contracts.py "--unblock=open:/"
      - name: coverage (the missing-test map - a discovery helper, never a metric)
        id: coverage
        continue-on-error: true
        run: |
          coverage run -m pytest tests -q
          coverage report -m
      - name: vulture (dead code)
        id: vulture
        continue-on-error: true
        run: vulture . --min-confidence 80 --exclude .git,.venv,__pycache__,models,llama-b10964-gpu,mutants,.testmondata
      - name: mutmut (the mutation trial)
        id: mutmut
        continue-on-error: true
        run: |
          pip install mutmut
          mutmut run
          mutmut results
      - name: python compile 3.12 (the syntax gate)
        id: compile312
        continue-on-error: true
        run: python3 -m compileall -q bench infra etc tests *.py
      - name: answers JSONL validation (the evidence gate)
        id: jsonl
        continue-on-error: true
        run: python3 validate_jsonl.py
      - name: the dry-run smoke (the orchestrator end-to-end, offline)
        id: smoke
        continue-on-error: true
        run: python3 full_benchmark.py --task v7 --v7-families 16 --dry-run --no-git
      - name: the aggregate verdict (any tool red = the run is red)
        if: always()
        run: |
          echo "=== TOOL VERDICTS ==="
          RED=0
          if [ "${{ steps.ruff.outcome }}" = "failure" ]; then echo "ruff: FAILURE"; RED=1; else echo "ruff: ${{ steps.ruff.outcome }}"; fi
          if [ "${{ steps.ty.outcome }}" = "failure" ]; then echo "ty: FAILURE"; RED=1; else echo "ty: ${{ steps.ty.outcome }}"; fi
          if [ "${{ steps.md.outcome }}" = "failure" ]; then echo "md: FAILURE"; RED=1; else echo "md: ${{ steps.md.outcome }}"; fi
          if [ "${{ steps.reqs.outcome }}" = "failure" ]; then echo "reqs: FAILURE"; RED=1; else echo "reqs: ${{ steps.reqs.outcome }}"; fi
          if [ "${{ steps.pytest.outcome }}" = "failure" ]; then echo "pytest: FAILURE"; RED=1; else echo "pytest: ${{ steps.pytest.outcome }}"; fi
          if [ "${{ steps.crosshair.outcome }}" = "failure" ]; then echo "crosshair: FAILURE"; RED=1; else echo "crosshair: ${{ steps.crosshair.outcome }}"; fi
          if [ "${{ steps.coverage.outcome }}" = "failure" ]; then echo "coverage: FAILURE"; RED=1; else echo "coverage: ${{ steps.coverage.outcome }}"; fi
          if [ "${{ steps.vulture.outcome }}" = "failure" ]; then echo "vulture: FAILURE"; RED=1; else echo "vulture: ${{ steps.vulture.outcome }}"; fi
          if [ "${{ steps.mutmut.outcome }}" = "failure" ]; then echo "mutmut: FAILURE"; RED=1; else echo "mutmut: ${{ steps.mutmut.outcome }}"; fi
          if [ "${{ steps.compile312.outcome }}" = "failure" ]; then echo "compile312: FAILURE"; RED=1; else echo "compile312: ${{ steps.compile312.outcome }}"; fi
          if [ "${{ steps.jsonl.outcome }}" = "failure" ]; then echo "jsonl: FAILURE"; RED=1; else echo "jsonl: ${{ steps.jsonl.outcome }}"; fi
          if [ "${{ steps.smoke.outcome }}" = "failure" ]; then echo "smoke: FAILURE"; RED=1; else echo "smoke: ${{ steps.smoke.outcome }}"; fi
          if [ "$RED" = "1" ]; then
            echo "AGGREGATE: RED - at least one tool failed"
            exit 1
          fi
          echo "AGGREGATE: GREEN - all tools passed"
