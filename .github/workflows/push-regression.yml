name: push regression run

# Addendum 158 (the author's ruling: "let's go nuclear. abolish the
# pre commit hook. run everything only in ci. If something fails we
# learn about it next pull and you fix"): THE hook is abolished; this
# workflow is the ONLY verification gate. It runs everything the hook
# used to run (ruff, format check, ty, md, requirements) plus the full
# suite, crosshair, coverage, vulture and mutmut. A red verdict is
# caught on the next pull (R-27) and fixed - nothing is skipped.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage vulture
      - name: ruff (lint)
        run: python3 -m ruff check .
      - name: ruff format (the format contract, checked not applied)
        run: python3 -m ruff format --check .
      - name: ty (type check)
        run: python3 ty_check.py
      - name: markdown check (GFM compliance)
        run: python3 AI_tools/md_check.py
      - name: requirements check (R-xx traceability)
        run: python3 requirements_check.py
      - name: pytest (the full suite - deterministic pins + hypothesis properties)
        run: python3 -m pytest tests -q
      - name: crosshair (the contract proofs)
        run: crosshair check tests/contracts.py
      - name: coverage (the missing-test map - a discovery helper, never a metric)
        run: |
          coverage run -m pytest tests -q
          coverage report -m
      - name: vulture (dead code)
        run: vulture . --min-confidence 80 --exclude .git,.venv,__pycache__,models,llama-b10964-gpu,mutants,.testmondata
      - name: mutmut (the mutation trial - non-gating, the tally lands in the log)
        run: |
          pip install mutmut
          mutmut run || true
          mutmut results || true
