name: push regression run

# R-25/R-31 final form (addendum 147): the commit hook stays <=5s
# (ruff, format-wrapper, ty, md, requirements, testmon-affected);
# EVERYTHING ELSE - the full pytest suite, crosshair contracts,
# coverage, vulture, the pre-commit drift report (the former
# daily-quality content, absorbed here) - runs on EVERY PUSH.
# The verdict is checked on every pull (R-27): a red run blocks the
# next delivery, not the commit.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage vulture pre-commit
      - name: pytest with testmon (the full suite - deterministic pins + hypothesis
          properties - the map seeds itself for any local clones)
        run: python3 -m pytest tests -q --testmon
      - name: mutmut (the mutation trial - session 40 addendum; too slow locally, CI owns it)
        run: |
          pip install mutmut
          mutmut run || true
          mutmut results || true
      - name: crosshair (the contract proofs)
        run: crosshair check tests/contracts.py
      - name: coverage (the missing-test map - a discovery helper, never a metric)
        run: |
          coverage run -m pytest tests -q
          coverage report -m
      - name: vulture (dead code)
        run: vulture . --min-confidence 80 --exclude .git,.venv,__pycache__,models,llama-b10964-gpu
      - name: pre-commit hook versions (the drift report)
        run: |
          pre-commit autoupdate || true
          git diff --exit-code -- .pre-commit-config.yaml || echo "HOOK DRIFT: pre-commit versions have newer tags - review and pin"
