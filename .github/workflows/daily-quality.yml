name: daily quality run

# The once-in-a-while class (session 40, addendum 24), DAILY since
# addendum 145 (the author's ruling: the weekly cadence became the
# daily cadence). The tools too slow or exploratory for the commit
# hook run at 00:00 UTC every day. Nothing here blocks commits - the
# artifacts land in the run log for the next session to read.
# mutmut deliberately left out (too expensive).

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC daily
  workflow_dispatch: {} # manual trigger for interrupted evaluations

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage vulture
      - name: pytest (the full suite - the R-31 layer home)
        run: python3 -m pytest tests -q
      - name: coverage (the missing-test map - a discovery helper, never a metric)
        run: |
          coverage run -m pytest tests -q
          coverage report -m
      - name: crosshair (the contract proofs)
        run: crosshair check tests/contracts.py
      - name: vulture (dead code)
        run: vulture . --min-confidence 80 --exclude .git,.venv,__pycache__,models,llama-b10964-gpu
      - name: pre-commit hook versions (the drift report)
        run: |
          pip install pre-commit
          pre-commit autoupdate || true
          git diff --exit-code -- .pre-commit-config.yaml || echo "HOOK DRIFT: pre-commit versions have newer tags - review and pin"
